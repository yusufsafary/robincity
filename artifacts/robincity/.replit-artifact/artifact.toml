kind = "web"
previewPath = "/"
title = "RobinCity"
version = "1.0.0"
id = "artifacts/robincity"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25548

[services.development]
run = "pnpm --filter @workspace/robincity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/robincity", "run", "build" ]
serve = "static"
publicDir = "artifacts/robincity/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25548"
BASE_PATH = "/"
